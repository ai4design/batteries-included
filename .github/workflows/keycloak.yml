---
name: Build and push Keycloak image

'on':
  workflow_dispatch:
    inputs:
      version:
        description: The upstream version of Keycloak to build from
        required: true
        type: string

permissions:
  id-token: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3

      - name: Login to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: .
          file: docker/keycloak.dockerfile
          push: true
          tags: ghcr.io/batteries-included/keycloak:${{ inputs.version }}
          build-args: |
            KC_VERSION=${{ inputs.version }}
